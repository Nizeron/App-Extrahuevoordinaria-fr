{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Climate Clicker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!--  Música global -->
<audio id="bg-music" src="{% static 'sounds/fondo1.mp3' %}" loop></audio>
<audio id="hover-sfx" src="{% static 'sounds/boton1.mp3' %}"></audio>

{% block content %}{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", () => {

    const music = document.getElementById("bg-music");
    const hover = document.getElementById("hover-sfx");

    /* 1) Restaurar tiempo */
    const savedTime = localStorage.getItem("music_time");
    if (savedTime) {
        music.currentTime = Number(savedTime);
    }

    /* 2) Si ya estaba sonando antes, no reiniciamos */
    if (localStorage.getItem("music_playing") === "true") {
        music.volume = 0; // fade-in suave
        music.play().catch(()=>{});
        fadeIn(music);
    }

    /* 3) Primera interacción → iniciar música */
    function enableMusic() {
        music.volume = 0;
        music.play().catch(()=>{});
        fadeIn(music);
        localStorage.setItem("music_playing", "true");
        window.removeEventListener("click", enableMusic);
        window.removeEventListener("keydown", enableMusic);
    }
    window.addEventListener("click", enableMusic);
    window.addEventListener("keydown", enableMusic);

    /* 4) Guardar tiempo justo antes de salir de la página */
    window.addEventListener("beforeunload", () => {
        localStorage.setItem("music_time", music.currentTime);
    });

    /* 5) Sonido hover botones */
    document.querySelectorAll(".btn-sound").forEach(btn => {
        btn.addEventListener("mouseenter", () => {
            hover.currentTime = 0;
            hover.volume = 0.85;
            hover.play();
        });
    });

});

/* Fade-in suave para evitar corte o salto */
function fadeIn(audio) {
    let vol = 0;
    const interval = setInterval(() => {
        vol += 0.03;
        if (vol >= 0.45) { // volumen final
            audio.volume = 0.30;
            clearInterval(interval);
        } else {
            audio.volume = vol;
        }
    }, 50);
}
</script>


</body>
</html>
