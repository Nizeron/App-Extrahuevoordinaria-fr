{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego Incremental</title>

    <!-- Pasar datos a JS -->
    <script>
    window.__INIT__ = {
        puntos: {{ puntos|default:"0"|safe }},
        click_power: {{ click_power|default:"1"|safe }}
    };
    </script>

    <!-- Archivos externos -->
    <script src="{% static 'js/juego.js' %}" defer></script>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ===== Música de fondo del juego =====
         - Archivo: static/sounds/Fondo videojuego.mp3
         - No uso autoplay directo para evitar bloqueos; el JS intentará reproducir y
           escuchará la primera interacción del usuario si el autoplay está bloqueado.
    -->
    <audio id="bg-music" src="{% static 'sounds/Fondo videojuego.mp3' %}" loop></audio>

    <!-- ✅ Fondo a pantalla completa -->
    <img class="bg-fullscreen"
        src="{% static 'images/ciudad basura.png' %}"
        alt="" aria-hidden="true">

    <!-- IZQUIERDA: CLICKER -->
    <div class="game-container">
        <h1>♻️ Reciclaje</h1>
        <p>Puntos: <span id="puntos">{{ puntos|default:"0" }}</span></p>

        <button id="clicker" class="pixel-button">
            <img class="recycle-icon" src="{% static 'images/Pixel-Art-Water-Bottle-6.webp' %}" alt="Botella">
            ¡Reciclar!
        </button>
    </div>

    <!-- CENTRO: TIENDA -->
    <div class="shop-container">
        <h2>Tienda</h2>

        <div class="shop-item" data-cost="20" data-power="1" id="carbono">
            <img src="{% static 'images/co2.jpeg' %}">
            <span>Captura de Carbono<br><span class="cost">Costo: 20</span></span>
        </div>
        <!--Candados-->
        <div class="shop-item" data-cost="50" data-power="2" id="solar">
            <img src="{% static 'images/panel.jpg' %}">
            <span>Energía Solar<br><span class="cost">Costo: 50</span></span>
        </div>

        <div class="shop-item" data-cost="100" data-power="3" id="buses">
            <img src="{% static 'images/bus.png' %}">
            <span>Transporte Eléctrico<br><span class="cost">Costo: 100</span></span>
        </div>

        <div class="shop-item" data-cost="200" data-power="4" id="techos">
            <img src="{% static 'images/panel.png' %}">
            <span>Techos Verdes<br><span class="cost">Costo: 200</span></span>
        </div>

        <div class="shop-item" data-cost="400" data-power="5" id="agua">
            <img src="{% static 'images/arbol.png' %}">
            <span>Ahorro de Agua<br><span class="cost">Costo: 400</span></span>
        </div>

        <div class="shop-item" data-cost="800" data-power="6" id="luces">
            <img src="{% static 'images/luces.png' %}">
            <span>Luces LED Inteligentes<br><span class="cost">Costo: 800</span></span>
        </div>
    </div>

    <!-- DERECHA: INFORMACIÓN DE MEJORAS -->
    <div id="info-box" class="info-box hidden">
        <h3 id="info-title"></h3>
        <p id="info-text"></p>
    </div>

    <!-- ✅ ✅ PANTALLA NEGRA (OCULTA HASTA USARLA) -->
    <div id="level-overlay">
        <p id="overlay-text"></p>
        <audio id="overlay-sound" src="{% static 'sounds/tra.mp3' %}"></audio>
    </div>

    <!-- ===== JS para manejar la música de fondo =====
         - Intenta reproducir al cargar.
         - Si el autoplay está bloqueado, reproducirá en el primer gesto del usuario.
         - Guarda currentTime en localStorage al ocultar/salir para dar sensación de continuidad.
    -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const bg = document.getElementById('bg-music');
        if (!bg) return;

        // Volumen inicial (0.0 - 1.0)
        try { bg.volume = 0.45; } catch (e) { /* ignore */ }

        // Restaurar tiempo guardado (si existe)
        try {
            const saved = parseFloat(localStorage.getItem('bg_music_time') || '0');
            if (!isNaN(saved) && saved > 0) {
                // Algunos navegadores lanzan si currentTime se asigna antes de estar cargado.
                bg.addEventListener('loadedmetadata', () => {
                    try { bg.currentTime = Math.min(saved, bg.duration || saved); } catch (_) {}
                }, { once: true });
            }
        } catch (_) {}

        // Intenta reproducir; si falla (autoplay), escucha la primera interacción del usuario
        function intentarPlay() {
            bg.play().catch(() => {
                // autoplay bloqueado; la reproducción se intentará con la primera interacción (continuará abajo)
            });
        }
        intentarPlay();

        // Primer gesto del usuario inicia la música si no se pudo iniciar automáticamente
        ['click', 'keydown', 'touchstart'].forEach(evt =>
            document.addEventListener(evt, function onFirst() {
                bg.play().catch(() => {});
                document.removeEventListener(evt, onFirst);
            }, { passive: true })
        );

        // Guardar posición cuando se abandona/oculta la página para "continuidad"
        function guardarPosicion() {
            try { localStorage.setItem('bg_music_time', String(bg.currentTime || 0)); } catch (_) {}
        }
        window.addEventListener('pagehide', guardarPosicion);
        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') guardarPosicion();
        });

        // Exponer función para pausar/reanudar desde la consola o botones
        window.toggleGameMusic = () => {
            if (bg.paused) bg.play().catch(() => {});
            else bg.pause();
        };
    });
    </script>

</body>
</html>
