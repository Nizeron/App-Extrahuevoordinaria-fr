{% extends "base.html" %}
{% load static %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="overlay"></div>

<div class="content">
    <h2>Crear cuenta</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

    </form>

    <p><a href="/sesion/" class="btn-sound">Volver</a></p>
</div>
{% endblock %}
